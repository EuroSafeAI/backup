<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EuroSafeAI has moved to safe.eu</title>
  <!-- Tell crawlers the canonical home is the new domain. -->
  <link rel="canonical" href="https://safe.eu/">
  <meta name="robots" content="noindex, follow">
  <!-- No-JS / crawler fallback: jump to the new domain root after a moment. -->
  <meta http-equiv="refresh" content="0; url=https://safe.eu/">
  <script>
    // Path-preserving redirect: /certificate/x -> https://safe.eu/certificate/x
    (function () {
      var dest = 'https://safe.eu' +
        window.location.pathname +
        window.location.search +
        window.location.hash;
      window.location.replace(dest);
    })();
  </script>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; margin: 4rem auto; max-width: 32rem; padding: 0 1rem; color: #1a1a1a; }
    a { color: #0b5fff; }
  </style>
</head>
<body>
  <h1>EuroSafeAI has moved</h1>
  <p>This site now lives at <a href="https://safe.eu/">safe.eu</a>.</p>
  <p>If you are not redirected automatically, follow the link above.</p>
</body>
</html>
